name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer deploy supersede one already in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only what the site serves. The mirroring sources -- src/, the
      # scripts and the docs -- stay in the repo for reproducible rebuilds but
      # are not part of the deployed site. Excluded by pattern rather than by
      # name so a script or document added later is not published by accident.
      - name: Stage site files
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.mirror-base' \
            --exclude='.mirror-staging' \
            --exclude='__pycache__' \
            --exclude='src' \
            --exclude='*.py' \
            --exclude='*.md' \
            ./ _site/
          echo "staged size: $(du -sh _site | cut -f1)"
          echo "staged files: $(find _site -type f | wc -l)"
          test -f _site/.nojekyll || { echo "::error::.nojekyll missing"; exit 1; }
          test -f _site/index.html || { echo "::error::index.html missing"; exit 1; }
          test -f _site/apply/index.html || { echo "::error::apply/ redirect missing"; exit 1; }
          leaked=$(find _site \( -name '*.py' -o -name '*.md' \) -print -quit)
          test -z "$leaked" || { echo "::error::source file leaked into the site: $leaked"; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
